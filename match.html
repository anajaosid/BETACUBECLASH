<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><title>CubeClash Match</title><link rel="stylesheet" href="css/main.css"></head>
<body class="match-window-body"><main id="matchWindowApp"><div class="match-window-loading">WAITING FOR MATCH CONNECTION…</div></main>
<script>
(function(){
const app=document.getElementById('matchWindowApp');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function rot(v,axis,dir){let[x,y,z]=v;if(axis==='x')return dir>0?[x,-z,y]:[x,z,-y];if(axis==='y')return dir>0?[z,y,-x]:[-z,y,x];return dir>0?[-y,x,z]:[y,-x,z]}
function build(size,scramble){const coords=[];for(let x=0;x<size;x++)for(let y=0;y<size;y++)for(let z=0;z<size;z++)coords.push({p:[x*2/(size-1)-1,y*2/(size-1)-1,z*2/(size-1)-1],stickers:[]});const colors={x1:'R',x0:'O',y1:'W',y0:'Y',z1:'G',z0:'B'};for(const c of coords){const[x,y,z]=c.p;if(x===1)c.stickers.push([[1,0,0],colors.x1]);if(x===-1)c.stickers.push([[-1,0,0],colors.x0]);if(y===1)c.stickers.push([[0,1,0],colors.y1]);if(y===-1)c.stickers.push([[0,-1,0],colors.y0]);if(z===1)c.stickers.push([[0,0,1],colors.z1]);if(z===-1)c.stickers.push([[0,0,-1],colors.z0]);}for(const token of scramble.trim().split(/\s+/)){if(!token)continue;const face=token[0],turns=token.endsWith('2')?2:1,dir=token.includes("'")?-1:1,axis={R:'x',L:'x',U:'y',D:'y',F:'z',B:'z'}[face],layer={R:1,L:-1,U:1,D:-1,F:1,B:-1}[face],sign={R:-1,L:1,U:1,D:-1,F:-1,B:1}[face];for(let n=0;n<turns;n++)for(const c of coords){const i=axis==='x'?0:axis==='y'?1:2;if(c.p[i]!==layer)continue;c.p=rot(c.p,axis,sign*dir);c.stickers=c.stickers.map(([normal,color])=>[rot(normal,axis,sign*dir),color]);}}return coords}
function stTransform(n,d){const[x,y,z]=n;if(x===1)return`rotateY(90deg) translateZ(${d}px)`;if(x===-1)return`rotateY(-90deg) translateZ(${d}px)`;if(y===1)return`rotateX(90deg) translateZ(${d}px)`;if(y===-1)return`rotateX(-90deg) translateZ(${d}px)`;if(z===1)return`translateZ(${d}px)`;return`rotateY(180deg) translateZ(${d}px)`}
function drawCube(root,puzzle,scramble){const size=puzzle==='222'?2:3,gap=size===2?7:5,cubie=size===2?62:48,pitch=cubie+gap,step=size===2?pitch/2:pitch,d=cubie/2;root.innerHTML='';root.style.width=`${size*pitch}px`;root.style.height=`${size*pitch}px`;for(const c of build(size,scramble)){const el=document.createElement('div');el.className='cubelet';el.style.width= cubie+'px';el.style.height=cubie+'px';el.style.setProperty('--half',d+'px');el.style.transform=`translate3d(${c.p[0]*step}px,${-c.p[1]*step}px,${c.p[2]*step}px)`;for(const[n,color]of c.stickers){const st=document.createElement('i');st.className='sticker '+color;st.style.transform=stTransform(n,d+1);el.appendChild(st)}root.appendChild(el)}}
function render(){const b=window.opener&&window.opener.CubeClashBridge;if(!b){app.innerHTML='<div class="match-window-loading">OPEN THIS MATCH WINDOW FROM CUBECLASH.</div>';return}const st=b.state;document.documentElement.style.colorScheme=st.theme==='light'?'light':'dark';document.body.classList.toggle('theme-light',st.theme==='light');app.innerHTML=`<div class="match-window"><header class="match-window-head"><div><strong>CUBECLASH MATCH</strong><span>ROOM ${esc(st.roomCode||'—')}</span></div><div class="match-window-status">${esc(st.phase==='solving'?'LIVE':'CONNECTED')}</div></header><section class="match-window-videos"><article><div class="match-window-label">${st.role==='host'?'PLAYER 1 / YOU':'PLAYER 2 / YOU'}</div><video id="local" autoplay muted playsinline></video><span id="localState">CAMERA WAITING</span></article><article><div class="match-window-label">${st.role==='host'?'PLAYER 2 / OPPONENT':'PLAYER 1 / OPPONENT'}</div><video id="remote" autoplay playsinline></video><span id="remoteState">${esc(st.opponent.status||'WAITING')}</span></article></section><section class="match-window-center"><div class="match-window-scramble">${esc(st.scramble||'WAITING FOR SCRAMBLE')}</div><div class="match-window-cube-wrap"><div id="matchCube" class="cube3d"></div></div><div class="match-window-timers"><div><small>YOU</small><strong id="myTimer">0.00</strong></div><div><small>OPPONENT</small><strong id="oppTimer">${esc(st.opponent.time||'0.00')}</strong></div></div></section></div>`;drawCube(document.getElementById('matchCube'),st.puzzle||'333',st.scramble||'');sync()}
function sync(){const b=window.opener&&window.opener.CubeClashBridge;if(!b)return;const st=b.state,l=document.getElementById('local'),r=document.getElementById('remote');if(l&&b.localStream&&l.srcObject!==b.localStream){l.srcObject=b.localStream;l.play().catch(()=>{});document.getElementById('localState').textContent='CAMERA CONNECTED'}if(r&&b.remoteStream&&r.srcObject!==b.remoteStream){r.srcObject=b.remoteStream;r.play().catch(()=>{});document.getElementById('remoteState').textContent='OPPONENT CAMERA CONNECTED'}const ot=document.getElementById('oppTimer');if(ot)ot.textContent=st.opponent.time||'0.00';const mt=document.getElementById('myTimer');if(mt&&st.phase==='solving')mt.textContent='LIVE'}
render();setInterval(()=>{if(window.opener&&!window.opener.closed){const b=window.opener.CubeClashBridge;if(b){const old=document.querySelector('.match-window');if(!old)render();else sync()}}},500);
})();
</script></body></html>
